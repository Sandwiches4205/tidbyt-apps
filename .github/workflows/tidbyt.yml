name: Rialto Cerrito to Tidbyt

on:
  schedule:
    # Every 30 minutes, roughly 7am - 1am Pacific (GitHub cron runs in UTC).
    - cron: "*/30 14-23,0-8 * * *"
    # Monthly no-op commit. GitHub switches off scheduled workflows after
    # ~60 days of repository inactivity; this keeps the clock running.
    - cron: "0 12 1 * *"
  # Lets you run it by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  push:
    if: github.event.schedule != '0 12 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pixlet
        run: |
          set -euo pipefail
          curl -fsSL -o pixlet.tar.gz \
            https://github.com/tidbyt/pixlet/releases/download/v0.34.0/pixlet_0.34.0_linux_amd64.tar.gz
          mkdir -p pixlet-bin
          tar -xzf pixlet.tar.gz -C pixlet-bin
          BIN="$(find pixlet-bin -type f -name pixlet | head -1)"
          if [ -z "$BIN" ]; then
            echo "Could not find the pixlet binary in the download." >&2
            exit 1
          fi
          chmod +x "$BIN"
          echo "PIXLET=$PWD/$BIN" >> "$GITHUB_ENV"

      # Prints what 511 actually sends back, so the ferry app can be pinned to
      # the right agency and stop codes. Only on manual runs. GitHub masks
      # secrets in logs, so the token does not appear in the output.
      - name: 511 diagnostic
        if: github.event_name == 'workflow_dispatch'
        env:
          TOKEN: ${{ secrets.FIVEONEONE_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "No FIVEONEONE_TOKEN secret set - skipping."
            exit 0
          fi
          echo "===== operators ====="
          curl -s "https://api.511.org/transit/operators?api_key=$TOKEN&format=json" \
            | tr -d '\000' | head -c 900; echo
          echo "===== ferry stops (operator SB) ====="
          curl -s "https://api.511.org/transit/stops?api_key=$TOKEN&operator_id=SB&format=json" \
            | tr -d '\000' | head -c 1500; echo
          echo "===== StopMonitoring, stop 7211 ====="
          curl -s "https://api.511.org/transit/StopMonitoring?api_key=$TOKEN&agency=SB&stopCode=7211&format=json" \
            | tr -d '\000' | head -c 1800; echo

      - name: Render and push each app
        env:
          TIDBYT_API_TOKEN: ${{ secrets.TIDBYT_API_TOKEN }}
          DEVICE_ID: ${{ secrets.TIDBYT_DEVICE_ID }}
          FIVEONEONE_TOKEN: ${{ secrets.FIVEONEONE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TIDBYT_API_TOKEN:-}" ] || [ -z "${DEVICE_ID:-}" ]; then
            echo "Missing secrets. Add TIDBYT_API_TOKEN and TIDBYT_DEVICE_ID under" >&2
            echo "Settings -> Secrets and variables -> Actions." >&2
            exit 1
          fi

          # push_app <file> <name shown on the device>
          #
          # Each app is copied into an empty folder before rendering. Pixlet
          # treats a folder as a single app, so two .star files sitting side by
          # side make it fail with "file does not exist".
          push_app () {
            if [ ! -f "$1" ]; then
              echo "skipping $1 - not in the repository yet"
              return 0
            fi
            echo "--- $1"
            rm -rf ./_render
            mkdir -p ./_render
            cp "$1" ./_render/
            "$PIXLET" render "./_render/$(basename "$1")" -o out.webp api_key="${FIVEONEONE_TOKEN:-}"
            "$PIXLET" push --installation-id "$2" "$DEVICE_ID" out.webp
          }

          push_app rialto_cerrito.star rialto
          push_app richmond_ferry.star richmondferry

  keepalive:
    if: github.event.schedule == '0 12 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit so GitHub keeps the schedule enabled
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "keep scheduled workflow alive"
          git push
